[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac-voice-control"
version = "0.1.0"
description = "Hands-free Mac control by voice: Jev typed action routing plus local Whisper STT plus AppleScript/AX execution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
mac = [
  "sounddevice>=0.4",
  "webrtcvad>=2.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mac-voice = "mac_voice.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
